{% extends 'base.html' %}

{% block title %} Entrar | Shortened URLs {% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4 shadow-sm">
                <h2>Entrar</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <br>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
                <p><a class="link-opacity-100-hover" href="{% url 'userapp:register' %}">Não possui uma conta? Criar conta</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
