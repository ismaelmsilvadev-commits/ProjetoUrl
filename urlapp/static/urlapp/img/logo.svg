<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" width="120" height="96" role="img" aria-label="Encurtador de URLs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Encurtador de URLs</title>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="116" y2="92">
      <stop offset="0" stop-color="#3d8bfd"/>
      <stop offset="1" stop-color="#0a58ca"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect x="4" y="4" width="112" height="88" rx="22" fill="url(#bg)"/>

  <g transform="translate(7 0)" stroke="#ffffff" stroke-linecap="round" fill="none">
    <!-- linhas de velocidade: o link longo sendo encurtado -->
    <g stroke-width="5">
      <line x1="16" y1="38" x2="23" y2="38" opacity="0.45"/>
      <line x1="12" y1="48" x2="23" y2="48" opacity="0.75"/>
      <line x1="16" y1="58" x2="23" y2="58" opacity="0.45"/>
    </g>
    <!-- ícone de link: duas metades de elo unidas por uma barra -->
    <g stroke-width="7" stroke-linejoin="round">
      <path d="M 55 36 H 42 A 12 12 0 0 0 42 60 H 55"/>
      <path d="M 65 36 H 78 A 12 12 0 0 1 78 60 H 65"/>
      <path d="M 47 48 H 73"/>
    </g>
  </g>
</svg>
